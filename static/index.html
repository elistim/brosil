<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бросил</title>
  <link rel="stylesheet" href="/style.css?v=24">
</head>
<body>
<div class="container">
  <h1>Бросил</h1>
  <div class="subtitle">Личный календарь привычек и достижений</div>

  <div class="tracker-heading">
    <h2>Мои счётчики</h2>
    <button id="trackerManagerToggle" class="secondary compact" type="button">Настроить</button>
  </div>
  <div class="cards" id="trackerCards"></div>

  <section id="trackerManager" class="tracker-manager" hidden>
    <div class="manager-title">Управление счётчиками</div>
    <form id="trackerForm" class="tracker-form">
      <label for="trackerName">Новый счётчик</label>
      <div class="tracker-form-row">
        <input id="trackerName" name="name" maxlength="40" placeholder="Например, Учёба" required>
        <button type="submit" class="confirm">Добавить</button>
      </div>
    </form>
    <div id="trackerMessage" class="tracker-message" role="status"></div>
    <div id="trackerList" class="tracker-list"></div>
  </section>

  <div class="calendar">
    <div class="month">
      <button onclick="changeMonth(-1)">←</button>
      <span id="monthTitle"></span>
      <button onclick="changeMonth(1)">→</button>
    </div>
    <div class="grid" id="calendar"></div>
    <form id="dayEditor" class="day-editor" hidden>
      <div class="editor-title" id="editorTitle"></div>
      <div id="trackerChecks" class="tracker-checks"></div>
      <div class="editor-actions">
        <button type="submit" class="confirm">Подтвердить</button>
        <button id="editorCancel" class="secondary" type="button">Отмена</button>
        <button id="editorReset" class="reset" type="button">Сбросить</button>
      </div>
    </form>
  </div>
</div>

<div id="foxChair" class="fox-chair" aria-hidden="true">
  <div class="chair-back"></div>
  <div class="chair-arms"></div>
  <div class="chair-seat"></div>
  <div class="chair-base"></div>
</div>
<img id="fox" class="fox" src="/foxy/animation/run/foxy-run_00.png" alt="fox">
<script src="/script.js?v=24"></script>
</body>
</html>
